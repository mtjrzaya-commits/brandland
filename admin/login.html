<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول | BRAND LAND</title>
<link rel="stylesheet" href="admin.css">
</head>
<body>

<div class="login-page">
  <div class="login-box">
    
    <div class="logo-area">
      <span class="crown">👑</span>
      <span class="logo-text">BRAND LAND</span>
      <div class="subtitle">لوحة التحكم</div>
    </div>

    <div class="login-error" id="errorBox">
      ⚠️ البريد الإلكتروني أو كلمة المرور غير صحيحة
    </div>

    <form id="loginForm" autocomplete="off">
      <div class="form-group">
        <label>📧 البريد الإلكتروني</label>
        <div class="input-wrap">
          <span class="icon">@</span>
          <input type="email" id="email" placeholder="admin@example.com" required>
        </div>
      </div>

      <div class="form-group">
        <label>🔐 كلمة المرور</label>
        <div class="input-wrap">
          <span class="icon">🔒</span>
          <input type="password" id="password" placeholder="••••••••" required>
        </div>
      </div>

      <button type="submit" class="login-btn" id="submitBtn">
        🚀 تسجيل الدخول
      </button>
    </form>

    <p style="text-align:center;color:var(--muted);font-size:12px;margin-top:20px;">
      © 2026 BRAND LAND - جميع الحقوق محفوظة
    </p>

  </div>
</div>

<script src="admin.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function(){
  
  // إذا كان مسجل الدخول بالفعل، انتقل للوحة
  if(typeof isLoggedIn === 'function' && isLoggedIn()){
    window.location.href = 'dashboard.html';
    return;
  }

  const form = document.getElementById('loginForm');
  const errorBox = document.getElementById('errorBox');
  const submitBtn = document.getElementById('submitBtn');

  form.addEventListener('submit', function(e){
    e.preventDefault();
    
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    errorBox.style.display = 'none';
    submitBtn.disabled = true;
    submitBtn.textContent = '⏳ جاري التحقق...';

    // استدعاء دالة login من admin.js
    if(typeof login === 'function'){
      login(email, password).then(result => {
        submitBtn.disabled = false;
        submitBtn.textContent = '🚀 تسجيل الدخول';

        if(result.success){
          if(typeof showToast === 'function'){
            showToast('✅ مرحباً بك!');
          }
          setTimeout(() => {
            window.location.href = 'dashboard.html';
          }, 500);
        } else {
          errorBox.style.display = 'block';
          document.getElementById('password').value = '';
        }
      }).catch(err => {
        submitBtn.disabled = false;
        submitBtn.textContent = '🚀 تسجيل الدخول';
        errorBox.style.display = 'block';
      });
    } else {
      submitBtn.disabled = false;
      submitBtn.textContent = '🚀 تسجيل الدخول';
      errorBox.style.display = 'block';
    }
  });

});
</script>

</body>
</html>
