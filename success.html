<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تم الطلب بنجاح | BRAND LAND</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ===== الهيدر ===== -->
<header>
  <div class="header-left">
    <button class="icon-btn" onclick="location.href='index.html'">←</button>
  </div>
  <div class="logo-center">
    <span class="crown">👑</span>
    <span class="logo-text">BRAND LAND</span>
  </div>
  <div class="header-right">
    <a href="cart.html">
      <button class="icon-btn">
        🛒
        <span class="cart-count-badge cart-count">0</span>
      </button>
    </a>
  </div>
</header>

<!-- ===== صفحة النجاح ===== -->
<div class="success-page">

  <div class="success-icon">✓</div>

  <h1>تمت عملية الطلب بنجاح</h1>

  <p>
    شكراً لك على ثقتك في BRAND LAND<br>
    سيتم تجهيز طلبك قريباً
  </p>

  <div class="order-number">
    <div class="label">رقم الطلب</div>
    <div class="number" id="orderNumber">#BL000000</div>
  </div>

  <div class="success-buttons">
    <a href="index.html" style="text-decoration:none;">
      <button class="btn-primary">
        🏠 العودة إلى الرئيسية
      </button>
    </a>

    <a href="mailto:mtjrzaya@gmail.com" style="text-decoration:none;">
      <button class="btn-secondary">
        📧 تواصل معنا
      </button>
    </a>
  </div>

  <p style="margin-top:30px;color:var(--muted);font-size:12px;">
    سيتم التواصل معك عبر البريد:<br>
    <a href="mailto:mtjrzaya@gmail.com" style="color:var(--gold);">mtjrzaya@gmail.com</a>
  </p>

</div>

<!-- ===== الفوتر ===== -->
<footer>
  <div class="logo-small">BRAND LAND</div>
  <p>📧 <a href="mailto:mtjrzaya@gmail.com">mtjrzaya@gmail.com</a></p>
  <p>© 2026 جميع الحقوق محفوظة</p>
</footer>

<script src="script.js"></script>
<script>
// استخراج رقم الطلب من الرابط
document.addEventListener('DOMContentLoaded', function(){
  const params = new URLSearchParams(window.location.search);
  const orderNum = params.get('order');
  if(orderNum){
    document.getElementById('orderNumber').textContent = '#' + orderNum;
  } else {
    document.getElementById('orderNumber').textContent = '#BL' + Math.floor(100000 + Math.random() * 900000);
  }
});
</script>

</body>
</html>
